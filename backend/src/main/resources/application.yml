spring:
  application:
    name: smart-lotus-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smart_lotus}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never

app:
  security:
    enabled: ${SECURITY_ENABLED:true}
    issuer-uri: ${SUPABASE_ISSUER_URI:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info

resilience4j:
  circuitbreaker:
    instances:
      gemma:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
  ratelimiter:
    instances:
      gemma:
        limit-for-period: 10
        limit-refresh-period: 1m
        timeout-duration: 0s

gemma:
  api:
    # KHÔNG hardcode key ở đây. Cài qua biến môi trường GEMMA_API_KEY.
    # Nếu trống, endpoint cá nhân hóa trả 503 với thông báo rõ ràng.
    key: ${GEMMA_API_KEY:}
    model: ${GEMMA_API_MODEL:gemma-4-31b-it}
    base-url: ${GEMMA_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
