spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

app:
  security:
    enabled: true
    issuer-uri: ${SUPABASE_ISSUER_URI}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
