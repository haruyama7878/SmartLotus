services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-lotus-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/smart_lotus
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      SECURITY_ENABLED: ${SECURITY_ENABLED:-true}
      SUPABASE_ISSUER_URI: ${SUPABASE_ISSUER_URI:?SUPABASE_ISSUER_URI must be set}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: smart-lotus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_lotus
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
    ports:
      - '5432:5432'
    volumes:
      - smart-lotus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d smart_lotus']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smart-lotus-postgres:
