name: Bug report
description: Report a reproducible defect
title: 'fix: '
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken and who is affected?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or API response
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, commit, or deployment version
